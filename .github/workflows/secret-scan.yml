name: Secret scan

# Scans the full git history for secrets with gitleaks: its default rules plus E&P
# Knowledge Base access keys (.gitleaks.toml). The repo is public, so a key that reaches
# any commit has to be treated as leaked; this check makes sure it is noticed.
#
# gitleaks runs as the released binary, verified against its published checksum, rather
# than through gitleaks-action, which needs a paid licence for organisation repos.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full history
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner -v .; then
            echo "::error::gitleaks found a possible secret (shown redacted above)."
            echo "If it is a real key: have it revoked now. Removing the commit does not undo"
            echo "the exposure. If it is a false positive, add an allowlist entry to .gitleaks.toml."
            exit 1
          fi
